[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bourse-ai-information"
version = "0.1.0"
description = "Asynchronous, evidence-preserving news and podcast analysis for Bourse AI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bourse-information = "bourse_ai_information.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
