[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bourse-ai-ml"
version = "0.1.0"
description = "Isolated, synthetic-data-first learning batch for Bourse AI"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scikit-learn>=1.8,<2", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
bourse-ml = "bourse_ai_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bourse_ai_ml = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["postgres: requires an explicitly supplied disposable PostgreSQL database"]
