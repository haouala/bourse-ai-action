services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: bourse_ai
      POSTGRES_USER: bourse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in environment or .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bourse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bourse -d bourse_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bourse_pgdata:
