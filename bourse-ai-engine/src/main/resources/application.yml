server:
  port: ${SERVER_PORT:8081}
information:
  ai:
    enabled: ${INFORMATION_AI_ENABLED:false}
    model: ${INFORMATION_AI_MODEL:gpt-5.4-mini-2026-03-17}
    prompt-version: information-v1
    lookback-days: ${INFORMATION_AI_LOOKBACK_DAYS:7}
    worker-token: ${INFORMATION_WORKER_TOKEN:}
    review-token: ${INFORMATION_REVIEW_TOKEN:}
  catalog: ${INFORMATION_CATALOG:classpath:information-sources.json}
  minimum-interval-seconds: ${INFORMATION_MINIMUM_INTERVAL_SECONDS:3600}
  scheduler:
    enabled: ${INFORMATION_SCHEDULER_ENABLED:false}
    delay-ms: ${INFORMATION_SCHEDULER_DELAY_MS:60000}
social:
  x:
    enabled: ${SOCIAL_X_ENABLED:false}
    bearer-token: ${SOCIAL_X_BEARER_TOKEN:}
    monthly-post-limit: ${SOCIAL_X_MONTHLY_POST_LIMIT:0}
    base-url: https://api.x.com
spring:
  application:
    name: bourse-ai-engine
  datasource:
    url: jdbc:h2:mem:bourseai;MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
engine:
  capital-eur: 1000
  horizon-months: 6
  maximum-universe: 500
  max-positions: 5
  risk-per-trade-eur: 5

market:
  scheduler:
    enabled: ${MARKET_SCHEDULER_ENABLED:false}
    worker-delay-ms: ${MARKET_WORKER_DELAY_MS:10000}
    monitor-delay-ms: ${PORTFOLIO_MONITOR_DELAY_MS:60000}
  quotas:
    providers:
      TWELVE_DATA:
        daily: ${TWELVE_DATA_DAILY_LIMIT:780}
        per-minute: ${TWELVE_DATA_MINUTE_LIMIT:8}
      EODHD:
        daily: ${EODHD_DAILY_LIMIT:18}
        per-minute: ${EODHD_MINUTE_LIMIT:20}
      FMP:
        daily: ${FMP_DAILY_LIMIT:240}
        per-minute: ${FMP_MINUTE_LIMIT:5}
  twelve-data:
    base-url: https://api.twelvedata.com
    api-key: ${TWELVE_DATA_API_KEY:}
  gdelt:
    base-url: https://api.gdeltproject.org
  sec:
    base-url: https://data.sec.gov
    user-agent: ${SEC_USER_AGENT:}
  fmp:
    base-url: https://financialmodelingprep.com
    api-key: ${FMP_API_KEY:}
  eodhd:
    base-url: https://eodhd.com
    api-key: ${EODHD_API_KEY:}

