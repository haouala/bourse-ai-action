name: Android validation and APK
on:
  push:
    branches: [feature/android-scaffold]
    paths: ['bourse-ai-android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['bourse-ai-android/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: bourse-ai-android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Checkout isolated V8 backend
        uses: actions/checkout@v4
        with:
          repository: haouala/bourse-ai-action
          ref: 856c5e538968515626fe370c1c1179b0ccba8875
          path: backend-contract
          persist-credentials: false
      - name: Build isolated V8 backend
        run: mvn -q -f ../backend-contract/bourse-ai-engine/pom.xml -DskipTests package
      - name: Build and validate against disposable backend
        run: python3 scripts/run_with_backend.py --jar ../backend-contract/bourse-ai-engine/target/bourse-ai-engine-0.1.0-SNAPSHOT.jar
      - name: Record validation and screenshot inventory
        run: python3 scripts/record_validation.py
      - name: Verify APK signature and record checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Save installable development APK
        uses: actions/upload-artifact@v4
        with:
          name: Bourse-AI-Android-debug
          path: bourse-ai-android/app/build/outputs/apk/debug/
          retention-days: 30
      - name: Save verification evidence and rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-validation-and-screens
          path: |
            bourse-ai-android/app/build/test-results/
            bourse-ai-android/app/build/reports/
            bourse-ai-android/app/build/outputs/screenshots/
            bourse-ai-android/app/build/outputs/validation.json
            bourse-ai-android/app/build/outputs/backend-contract.json
            bourse-ai-android/app/build/outputs/backend-integration.log
          retention-days: 30
