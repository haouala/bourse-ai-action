name: Android Demo APK
on:
  push:
    branches:
      - feature/android-demo-dashboard
      - feature/model-monitoring
  pull_request:
    paths:
      - 'android-demo/**'
      - '.github/workflows/android-demo-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable offline demo APK
        run: gradle -p android-demo :app:assembleDebug --no-daemon --stacktrace
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: bourse-ai-demo-apk
          path: android-demo/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
