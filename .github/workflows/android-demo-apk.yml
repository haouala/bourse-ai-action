name: Android Demo APK
on:
  push:
    branches:
      - feature/android-demo-dashboard
      - feature/model-monitoring
  pull_request:
    paths:
      - 'android-demo/**'
      - '.github/workflows/android-demo-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK commandline tools and platform
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools/latest"
          curl --fail --location --retry 3 --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            --output /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools/* "$SDK/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable offline demo APK
        run: gradle -p android-demo :app:assembleDebug --no-daemon --stacktrace
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: bourse-ai-demo-apk
          path: android-demo/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
