name: Information worker and backend validation
on:
  push:
    branches: [feature/information-ai-hourly]
    paths: ['bourse-ai-information/**', 'bourse-ai-engine/**', 'bourse-ai-ml/**', '.github/workflows/information.yml']
  pull_request:
    paths: ['bourse-ai-information/**', 'bourse-ai-engine/**', 'bourse-ai-ml/**', '.github/workflows/information.yml']
permissions:
  contents: read
concurrency:
  group: information-${{ github.ref }}
  cancel-in-progress: true
jobs:
  information:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: information_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: bourse_ml_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U information_test -d bourse_ml_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: bourse-ai-engine/pom.xml
      - name: Backend H2 regression and package
        run: mvn -B -f bourse-ai-engine/pom.xml clean verify
      - name: Worker unit and HTTP-contract tests without API keys
        run: PYTHONPATH=bourse-ai-information/src python -m unittest discover -s bourse-ai-information/tests -v
      - name: Real JAR and Python smoke with synthetic AI and H2 restart
        run: python bourse-ai-information/scripts/local_smoke.py --jar bourse-ai-engine/target/bourse-ai-engine-0.1.0-SNAPSHOT.jar --output bourse-ai-information/output/smoke-h2.json
      - name: Backend PostgreSQL regression
        env:
          BOURSE_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/bourse_ml_test_ci
          BOURSE_TEST_DB_USER: information_test
          BOURSE_TEST_DB_PASSWORD: synthetic-ci-only
        run: mvn -B -f bourse-ai-engine/pom.xml test
      - name: Install locked ML dependencies
        run: python -m pip install -r bourse-ai-ml/requirements.lock
      - name: ML regression including price-only models
        working-directory: bourse-ai-ml
        env:
          BOURSE_ML_TEST_DSN: host=127.0.0.1 port=5432 user=information_test dbname=bourse_ml_test_ci
        run: python -m pytest -q --junitxml=output/tests.xml
      - name: Real JAR and worker on disposable PostgreSQL with restart
        env:
          DB_USER: information_test
          DB_PASSWORD: synthetic-ci-only
        run: |
          psql -h 127.0.0.1 -U information_test -d postgres -c 'CREATE DATABASE bourse_information_test_ci'
          python bourse-ai-information/scripts/local_smoke.py --jar bourse-ai-engine/target/bourse-ai-engine-0.1.0-SNAPSHOT.jar --postgres-url jdbc:postgresql://127.0.0.1:5432/bourse_information_test_ci --output bourse-ai-information/output/smoke-postgres.json
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bourse-AI-information-validation
          path: |
            bourse-ai-engine/target/surefire-reports/
            bourse-ai-information/output/
            bourse-ai-ml/output/tests.xml
          retention-days: 30
